<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | Fashion Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260721-mobile-products">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header>
<div class="mobile-left"><span class="menu-icon" onclick="toggleMenu()">Menu</span></div>
<a class="logo" href="index.html" aria-label="Fashion Store home">Fashion Store</a>
<nav id="navMenu">
<a href="index.html">Home</a>
<a href="men.html">Men</a>
<a href="women.html">Women</a>
<a href="index.html#shop">Shop</a>
<a href="cart.html">Cart</a>
<a href="track.html">Track Order</a>
<a href="support.html">Support</a>
</nav>
<div class="mobile-right"><button class="theme-mode-btn" type="button" aria-label="Switch dark or white mode" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i><span>Dark</span></button><a href="cart.html" class="cart-icon"><i class="fa-solid fa-bag-shopping"></i><span id="cartCount">0</span></a></div>
</header>

<div class="back-btn">
<a href="index.html">Back to Home</a>
</div>

<section class="products">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3 id="totalPrice"></h3>

<div class="checkout-form">
<input type="text" id="customerName" placeholder="Full Name" autocomplete="name" required>
<input type="tel" id="customerPhone" placeholder="Phone Number" autocomplete="tel" required>
<input type="text" id="customerCity" list="cityList" placeholder="City" autocomplete="address-level2" required>
<datalist id="cityList"></datalist>
<input type="text" id="customerAddress" placeholder="Delivery Address" autocomplete="street-address" required>
<input type="text" id="customerNotes" placeholder="Notes for delivery (optional)">
<div class="payment-methods" aria-label="Payment method">
<label><input type="radio" name="paymentMethod" value="cash" checked> Cash / WhatsApp</label>
<label class="card-payment-option"><input type="radio" name="paymentMethod" value="card"> Bank card</label>
</div>
<p class="payment-note" id="paymentNote"></p>
<button type="button" id="orderSubmitBtn" onclick="sendOrder()">Place Order</button>
<p class="admin-status" id="orderStatus"></p>
</div>
</section>

<footer class="site-footer">
<p>&copy; 2026 Fashion Store</p>
<nav class="footer-links" aria-label="Store policies">
<a href="policies.html">Shipping, Returns & Privacy</a>
<a href="support.html">Support</a>
<a href="track.html">Track Order</a>
</nav>
</footer>
<script src="assets/js/config.js?v=20260713-mobile-layer"></script>
<script src="assets/js/script.js?v=20260721-mobile-products"></script>
</body>
</html>
