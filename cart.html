<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | Fashion Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>

<h1 class="logo">Fashion Store</h1>

<nav>
<a href="index.html">Home</a>
<a href="tshirts.html">T-Shirts</a>
<a href="jeans.html">Jeans</a>
<a href="jackets.html">Jackets</a>
<a href="shoes.html">Shoes</a>
<a href="support.html">Support</a>
<a href="admin.html">Admin</a>
</nav>

<div class="header-icons">
<a href="cart.html" class="cart-icon">
<i class="fa-solid fa-bag-shopping"></i>
<span id="cartCount">0</span>
</a>
</div>

</header>


<div class="back-btn">
<a href="index.html">⬅ Back to Home</a>
</div>


<section class="products">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<h3 id="totalPrice"></h3>


<div class="checkout-form">

<input type="text" id="customerName" placeholder="Full Name">

<input type="text" id="customerPhone" placeholder="Phone Number">

<input type="text" id="customerAddress" placeholder="Delivery Address">

<button onclick="sendOrder()">Order via WhatsApp</button>

</div>

</section>



<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cartItems");

let total = 0;

cart.forEach((item,index)=>{

let div = document.createElement("div");

div.className = "cart-item";

div.innerHTML = `
${item.name} - MAD ${item.price}
<button onclick="removeItem(${index})">Remove</button>
`;

container.appendChild(div);

total += item.price;

});

document.getElementById("totalPrice").innerText = "Total: MAD " + total;



function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart", JSON.stringify(cart));

location.reload();

}



function sendOrder(){

let name = document.getElementById("customerName").value;
let phone = document.getElementById("customerPhone").value;
let address = document.getElementById("customerAddress").value;

if(name=="" || phone=="" || address==""){
alert("Please fill all fields");
return;
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let message="New Order 🛒%0A%0A";

let total=0;

cart.forEach(item=>{
message+=item.name+" - MAD "+item.price+"%0A";
total+=item.price;
});

message+="%0AName: "+name;
message+="%0APhone: "+phone;
message+="%0AAddress: "+address;
message+="%0ATotal: MAD "+total;

let url="https://wa.me/212775089960?text="+message;

window.open(url,"_blank");

}

</script>

</body>
</html>
