[build]
  publish = "netlify-deploy"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # sqlite3 is a native module used only in local dev (SQLite fallback). The
  # deployed backend always runs in Postgres/Supabase mode, so we keep sqlite3
  # (and pg-mem, used only by local tests) out of the function bundle.
  external_node_modules = ["sqlite3", "pg-mem"]

# API -> serverless function (same origin, no CORS). Netlify rewrites /api/* to the
# deployed function at /.netlify/functions/api.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/track"
  to = "/track.html"
  status = 200

[[redirects]]
  from = "/men"
  to = "/men.html"
  status = 200

[[redirects]]
  from = "/women"
  to = "/women.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/index.html#shop"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  # JS/CSS config must revalidate so config/API-base changes reach browsers
  # quickly. Content-hashed/immutable images are still safe to cache long-term.
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"