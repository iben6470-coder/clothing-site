services:
  - type: web
    name: clothing-site-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://fashionstoreilyass.netlify.app
      - key: DB_PATH
        value: /data/clothing_site.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CARD_PAYMENT_URL
        sync: false
    disk:
      name: clothing-site-data
      mountPath: /data
      sizeGB: 1

