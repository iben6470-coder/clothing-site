services:
  - type: web
    name: clothing-site-api
    env: node
    # NOTE: persistent disks are NOT available on the free plan. Starter is the
    # cheapest plan that supports the disk below (SQLite DB + uploads survive redeploys).
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://stellar-parfait-759959.netlify.app
      - key: DB_PATH
        value: /data/clothing_site.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CARD_PAYMENT_URL
        sync: false
    disk:
      name: clothing-site-data
      mountPath: /data
      sizeGB: 1


