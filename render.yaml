services:
  - type: web
    name: clothing-site-api
    env: node
    # Free plan works because store data lives in Supabase Postgres (DATABASE_URL)
    # and uploaded images live in Supabase Storage (SUPABASE_URL / SUPABASE_SERVICE_KEY).
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://stellar-parfait-759959.netlify.app
      - key: CARD_PAYMENT_URL
        sync: false